<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a2b">
  <title>全商品席位资金流向与持仓看板｜手机样本</title>
  <style>
    :root{--navy:#101a2b;--ink:#16243a;--muted:#65758b;--line:#e4eaf1;--page:#f4f7fb;--card:#fff;--red:#c94b4b;--green:#17805f;--amber:#ba7d14;--blue:#2b68ad}
    *{box-sizing:border-box} body{margin:0;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.45}.wrap{max-width:680px;margin:auto;padding-bottom:34px}.hero{background:linear-gradient(135deg,#0f192a,#1e3556);padding:25px 18px 21px;color:#fff}.eyebrow{font-size:12px;letter-spacing:.08em;color:#b8c9df}.hero h1{font-size:25px;line-height:1.2;margin:7px 0 9px}.hero p{margin:0;color:#d4deeb;font-size:13px}.notice{margin:12px 14px 0;padding:9px 11px;border:1px solid #f1ddb0;border-radius:10px;background:#fff9e9;color:#72530e;font-size:12px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 14px 11px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff;color:#506076;white-space:nowrap;font:inherit;cursor:pointer}.tabs button.active{background:var(--navy);border-color:var(--navy);color:#fff}.content{padding:0 14px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.metric{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0}.metric span{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.metric strong{font-size:18px;white-space:nowrap}.positive{color:var(--red)}.negative{color:var(--green)}.neutral{color:var(--ink)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}.card h2{margin:0;padding:13px 14px 9px;font-size:16px}.sub{padding:0 14px 12px;color:var(--muted);font-size:12px}.bars{padding:2px 14px 14px}.bar-row{display:grid;grid-template-columns:58px 1fr 48px;align-items:center;gap:8px;margin:9px 0;font-size:12px}.track{height:9px;border-radius:7px;background:#edf2f7;overflow:hidden}.fill{height:100%;border-radius:7px}.fill.red{background:var(--red)}.fill.green{background:var(--green)}.product-list{display:grid;gap:9px;padding:0 14px 14px}.product{border:1px solid var(--line);border-radius:11px;padding:11px}.product-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.product h3{font-size:14px;margin:0}.product strong{font-size:16px}.product p{color:var(--muted);margin:5px 0 0;font-size:12px}.tag{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:600}.tag.long{background:#fff0ef;color:#a63d3b}.tag.short{background:#e8f6f0;color:#137455}.tag.dual{background:#fff6df;color:#9a6510}.foot{padding:12px 14px 0;color:var(--muted);font-size:11px}.empty{padding:28px 14px;color:var(--muted);text-align:center}@media(min-width:720px){body{padding:20px 0}.wrap{box-shadow:0 12px 38px rgba(15,32,58,.12);border-radius:20px;overflow:hidden;background:var(--page)}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero"><div class="eyebrow">MOBILE SAMPLE · 静态展示</div><h1>全商品席位资金流向与持仓看板</h1><p>按板块查看资金流、净持仓变化与重点品种动作</p></header>
    <div class="notice">样本数据截止：席位 2026-07-02，价格 2026-07-03。仅用于手机端交互与版式验收，不代表当前交易日。</div>
    <nav class="tabs" id="tabs" aria-label="板块切换"></nav>
    <section class="content" id="app"></section>
    <footer class="foot">口径：名义资金流向基于可观察的前 20 席位持仓变化；红色为偏多动作，绿色为偏空动作。席位画像和历史回测需以完整 member_rank 历史为准。</footer>
  </main>
  <script>
  const sectors=[
    {name:'汇总',flow:'127.4亿',flowCls:'positive',change:'58,704手',ret:'-4.9%',desc:'70 个价格品种 / 66 个席位品种；各板块资金净流向',bars:[['金融',124.5,'red'],['贵金属',37.8,'red'],['农产品',23.7,'red'],['有色',12.1,'red'],['化工',5.7,'red'],['石油',-2,'green'],['黑色',-0.7,'green']],products:[['30年国债','51.7亿','long','多头增仓进攻','金融板块中资金流入最显著'],['黄金','43.4亿','long','多头增仓进攻','贵金属板块核心多头品种'],['中证500','38.0亿','dual','多空双增博弈','持仓扩张而方向分歧较大'],['热卷','-5.6亿','short','空头增仓进攻','黑色板块主要空头动作']]},
    {name:'黑色',flow:'-0.7亿',flowCls:'negative',change:'-27,919手',ret:'-4.9%',desc:'12 个品种；重点观察铁矿、热卷、螺纹、焦煤',bars:[['铁矿',7.6,'red'],['纸浆',2.6,'red'],['焦炭',2,'red'],['不锈钢',1.4,'red'],['热卷',-5.6,'green'],['螺纹',-4,'green'],['硅锰',-3.8,'green']],products:[['铁矿','7.6亿','dual','多空双增博弈','20 日涨跌 -6.8%；品种净持仓偏空'],['焦炭','2.0亿','long','空头回补 / 多头占优','资金流向为正，需结合现货与仓单确认'],['热卷','-5.6亿','short','空头增仓进攻','20 日涨跌 -3.0%'],['螺纹','-4.0亿','short','空头增仓进攻','20 日涨跌 -3.2%']]},
    {name:'有色',flow:'12.1亿',flowCls:'positive',change:'-1,472手',ret:'-5.9%',desc:'11 个品种；碳酸锂与沪铜为主要资金流入方向',bars:[['碳酸锂',10.4,'red'],['沪铜',10,'red'],['沪铝',1.3,'red'],['工业硅',0.7,'red'],['沪锌',-4.2,'green'],['氧化铝',-4,'green'],['沪镍',-1.5,'green']],products:[['碳酸锂','10.4亿','long','空头回补 / 多头占优','20 日涨跌 -4.9%；席位方向仍需与产业库存交叉验证'],['沪铜','10.0亿','long','多头增仓进攻','20 日涨跌 -2.1%'],['沪锌','-4.2亿','short','空头增仓进攻','20 日涨跌 -4.4%'],['氧化铝','-4.0亿','dual','多空双增博弈','资金流为负，持仓博弈加大']]},
    {name:'金融',flow:'124.5亿',flowCls:'positive',change:'10,014手',ret:'-0.1%',desc:'8 个品种；国债与股指持仓动作最强',bars:[['30年国债',51.7,'red'],['10年国债',46.1,'red'],['中证500',38,'red'],['5年国债',10.3,'red'],['上证50',-16.4,'green'],['中证1000',-13.1,'green']],products:[['30年国债','51.7亿','long','多头增仓进攻','20 日涨跌 -0.5%'],['10年国债','46.1亿','long','空头回补 / 多头占优','20 日涨跌 -0.1%'],['中证500','38.0亿','dual','多空双增博弈','20 日涨跌 +4.8%'],['上证50','-16.4亿','dual','多空双增博弈','持仓扩张，方向分歧较大']]},
    {name:'化工',flow:'5.7亿',flowCls:'positive',change:'24,708手',ret:'-14.2%',desc:'13 个品种；甲醇多空双增，PVC、PP 空头动作显著',bars:[['甲醇',17.9,'red'],['橡胶',3.4,'red'],['对二甲苯',1.3,'red'],['PVC',-5.2,'green'],['聚丙烯',-5.2,'green'],['苯乙烯',-3.9,'green']],products:[['甲醇','17.9亿','dual','多空双增博弈','20 日涨跌 -18.7%'],['橡胶','3.4亿','long','空头回补 / 多头占优','20 日涨跌 -9.4%'],['PVC','-5.2亿','short','多头离场 / 空头占优','20 日涨跌 -12.0%'],['聚丙烯','-5.2亿','short','多头离场 / 空头占优','20 日涨跌 -18.6%']]},
    {name:'农产品',flow:'23.7亿',flowCls:'positive',change:'52,759手',ret:'-1.1%',desc:'18 个品种；棉花、菜粕、豆粕呈现明显持仓扩张',bars:[['棉花',11.4,'red'],['菜粕',6.1,'red'],['豆粕',4.4,'red'],['棕榈油',1.9,'red'],['白糖',-2.9,'green'],['豆一',-2,'green']],products:[['棉花','11.4亿','dual','多空双增博弈','20 日涨跌 -1.2%'],['菜粕','6.1亿','dual','多空双增博弈','资金流入但方向分歧'],['豆粕','4.4亿','dual','多空双增博弈','20 日涨跌 +0.2%'],['白糖','-2.9亿','short','多头离场 / 空头占优','20 日涨跌 -3.4%']]},
    {name:'石油',flow:'-2.0亿',flowCls:'negative',change:'-1,624手',ret:'-22.8%',desc:'5 个品种；液化气空头动作突出',bars:[['燃油',0.5,'red'],['低硫燃油',0,'red'],['液化气',-2.2,'green'],['沥青',-0.3,'green']],products:[['燃油','0.5亿','long','空头回补 / 多头占优','20 日涨跌 -27.7%'],['液化气','-2.2亿','dual','多空双增博弈','20 日涨跌 -20.9%'],['沥青','-0.3亿','dual','多空双增博弈','20 日涨跌 -12.9%']]},
    {name:'航运',flow:'0.0亿',flowCls:'neutral',change:'0手',ret:'-31.8%',desc:'欧线为唯一品种；当期可观察席位资金流接近零',bars:[['欧线',0,'green']],products:[['欧线','0.0亿','dual','持仓稳定','20 日涨跌 -31.8%；本样本不对缺失席位作方向推断']]},
    {name:'贵金属',flow:'37.8亿',flowCls:'positive',change:'2,198手',ret:'-16.5%',desc:'黄金多头资金流入显著，白银呈空头动作',bars:[['黄金',43.4,'red'],['白银',-5.6,'green']],products:[['黄金','43.4亿','long','多头增仓进攻','20 日涨跌 -8.8%'],['白银','-5.6亿','short','多头离场 / 空头占优','20 日涨跌 -24.2%']]}
  ];
  let active=0; const app=document.getElementById('app'),tabs=document.getElementById('tabs');
  const cls=v=>v==='red'?'positive':v==='green'?'negative':'neutral';
  function render(){const s=sectors[active], max=Math.max(...s.bars.map(x=>Math.abs(x[1])),1);tabs.innerHTML=sectors.map((x,i)=>`<button class="${i===active?'active':''}" aria-pressed="${i===active}" data-i="${i}">${x.name}</button>`).join('');app.innerHTML=`<div class="summary"><div class="metric"><span>资金流向</span><strong class="${s.flowCls}">${s.flow}</strong></div><div class="metric"><span>净持仓变化</span><strong>${s.change}</strong></div><div class="metric"><span>20日均涨跌</span><strong class="negative">${s.ret}</strong></div></div><article class="card"><h2>${s.name} · 资金流向</h2><div class="sub">${s.desc}</div><div class="bars">${s.bars.map(([n,v,c])=>`<div class="bar-row"><span>${n}</span><div class="track"><div class="fill ${c}" style="width:${Math.max(Math.abs(v)/max*100,v===0?2:0)}%"></div></div><b class="${cls(c)}">${v>0?'+':''}${v.toFixed(1)}亿</b></div>`).join('')}</div></article><article class="card"><h2>重点品种持仓动作</h2><div class="sub">展示资金流较显著的品种；点击板块标签切换查看</div><div class="product-list">${s.products.map(([n,v,t,action,note])=>`<div class="product"><div class="product-top"><h3>${n}</h3><strong class="${t==='short'?'negative':'positive'}">${v}</strong></div><p><span class="tag ${t}">${action}</span></p><p>${note}</p></div>`).join('')}</div></article>`;tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=+b.dataset.i;render();window.scrollTo({top:0,behavior:'smooth'})})}render();
  </script>
</body>
</html>
