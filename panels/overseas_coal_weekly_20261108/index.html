<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海外煤焦周报｜2026年11月8日</title></head><body><p style="font:16px sans-serif;padding:20px">正在打开海外煤焦周报…</p><script>(async()=>{try{const parts=await Promise.all(Array.from({length:16},(_,i)=>fetch('report-'+String(i).padStart(2,'0')+'.bin').then(r=>{if(!r.ok)throw Error('报告加载失败');return r.arrayBuffer()})));let text=await new Response(new Blob(parts).stream().pipeThrough(new DecompressionStream('gzip'))).text();text=text.replace(/[\r\n]+/g,'\n').replace("日度样本合计，单位GW（日均出力，原值MW÷1000）。各电源类型覆盖范围不同。","日度有效样本合计，单位GW（日均出力，原值MW÷1000）。各电源覆盖范围不同；2026-11-06有效指数66个，11-05为190个。11月6日缺报较多，合计下降不能视作全欧出力同幅下降。");const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)))].map(x=>x.toString(16).padStart(2,'0')).join('');if(hash!=="7a23ffa8903f17d00b851a264e2fa17831d6372940458a0a597b1c7a33f481be")throw Error('报告校验失败，请刷新重试');document.open();document.write(text);document.close();}catch(e){document.body.textContent='暂时无法打开报告，请刷新重试。';console.error(e)}})();</script></body></html>
