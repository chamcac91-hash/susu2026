<script>
const payload=JSON.parse(document.getElementById('payload').textContent);

const state={dataset:payload.defaultDataset,valueType:'monthly',years:new Set(payload.years.map(String)),provinces:[payload.defaultProvince]};
const $=id=>document.getElementById(id);function ds(){return payload.datasets[state.dataset]}function fmtNum(v,d=1){return(v==null||!isFinite(v))?'':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d})}function fmtPct(v){return(v==null||!isFinite(v))?'':(v>0?'+':'')+(v*100).toFixed(1)+'%'}function cls(v){return v>0?'up':v<0?'down':'flat'}function label(){return state.valueType==='monthly'?'当月值':'累计值'}function selected(){return state.provinces.filter(p=>ds().provinces.includes(p))}
function defaultProvinces(){const d=ds();return state.dataset==='nbs_raw_coal'?['全国','山西','内蒙古','陕西'].filter(x=>d.provinces.includes(x)):['合计','山西','内蒙古','陕西'].filter(x=>d.provinces.includes(x))}

function init(){ $('datasetSelect').innerHTML=Object.values(payload.datasets).map(d=>`<option value="${d.id}">${d.title}</option>`).join(''); $('datasetSelect').value=state.dataset; $('yearChecks').innerHTML=payload.years.map(y=>`<label><input type="checkbox" value="${y}" checked />${y}</label>`).join('');
  $('datasetSelect').addEventListener('change',e=>{state.dataset=e.target.value;state.provinces=defaultProvinces();renderAll(true)});$('valueType').addEventListener('change',e=>{state.valueType=e.target.value;renderAll(false)});$('provinceSelect').addEventListener('change',e=>{state.provinces=[...e.target.selectedOptions].map(o=>o.value);renderAll(false)});$('yearChecks').addEventListener('change',e=>{if(e.target.matches('input')){state.years=new Set([...$('yearChecks').querySelectorAll('input:checked')].map(x=>x.value));renderAll(false)}});$('provinceSearch').addEventListener('input',renderMiniGrid);$('sortMode').addEventListener('change',renderMiniGrid);$('panelLimit').addEventListener('change',renderMiniGrid);$('exportCsv').addEventListener('click',exportCsv);$('topBtn').addEventListener('click',()=>setProvinces(defaultProvinces()));$('allBtn').addEventListener('click',()=>setProvinces(ds().provinces));$('oneBtn').addEventListener('click',()=>setProvinces([selected()[0]||ds().provinces[0]])); }

function latestRow(p){return ds().summary.find(r=>r.province===p)||{}}
function renderMeta(){const d=ds();$('latestInfo').textContent=`最新月份：${d.latestMonth}；页面生成：${payload.generatedAt.replace('T',' ')}`;$('tableHint').textContent=`${d.title} · 已选 ${selected().length} 个`;$('sourceMeta').innerHTML=`<div><b>${d.title}</b></div><div>${d.description}</div><div>来源文件：${d.sourceFiles.map(x=>x.split(/[\\\\/]/).slice(-1)[0]).join(' / ')}</div>`;$('notes').innerHTML=payload.notes.map(x=>`• ${x}`).join('<br>')}
function renderKpis(){const rows=selected().slice(0,6).map(p=>latestRow(p));$('mainTitle').textContent=`${ds().title}：${selected().join('、')}（${label()}）`;$('kpis').innerHTML=rows.map(r=>{const value=state.valueType==='monthly'?r.monthly:r.cumulative;const yoy=state.valueType==='monthly'?r.yoyPct:r.cumulativeYoyPct;return `<div class="kpi"><div class="label">${r.province}｜${r.latestDate||''}</div><div class="value">${fmtNum(value)}</div><div class="delta ${cls(yoy)}">同比 ${fmtPct(yoy)}；累计同比 ${fmtPct(r.cumulativeYoyPct)}</div></div>`}).join('')}
function rangeFor(provinces,valueType,years){let vals=[];provinces.forEach(p=>{const data=ds().series[p]?.[valueType]||{};years.forEach(y=>(data[y]||[]).forEach(x=>{if(isFinite(x.value))vals.push(x.value)}))});if(!vals.length)return[0,1];let min=Math.min(...vals),max=Math.max(...vals);if(min>0)min=0;const pad=(max-min)*.08||max*.08||1;return[Math.max(0,min-pad),max+pad]}
function drawChart(svg,provinces,valueType,w=980,h=540,mini=false){const years=[...state.years].sort();const [minY,maxY]=rangeFor(provinces,valueType,years);const m=mini?{l:34,r:8,t:12,b:24}:{l:66,r:24,t:22,b:50};const iw=w-m.l-m.r,ih=h-m.t-m.b;const sx=month=>m.l+(month-1)/11*iw;const sy=v=>m.t+(maxY-v)/(maxY-minY||1)*ih;let html=`<rect x="0" y="0" width="${w}" height="${h}" fill="white"/>`;for(let i=0;i<=4;i++){const y=m.t+ih*i/4;const val=maxY-(maxY-minY)*i/4;html+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y}" y2="${y}" stroke="#e5edf5"/>`;if(!mini)html+=`<text x="${m.l-8}" y="${y+4}" text-anchor="end" font-size="12" fill="#64748b">${fmtNum(val,0)}</text>`}for(let month=1;month<=12;month++){const x=sx(month);html+=`<line x1="${x}" x2="${x}" y1="${m.t}" y2="${h-m.b}" stroke="#f1f5f9"/>`;if(!mini)html+=`<text x="${x}" y="${h-18}" text-anchor="middle" font-size="12" fill="#64748b">${month}月</text>`}html+=`<line x1="${m.l}" x2="${w-m.r}" y1="${h-m.b}" y2="${h-m.b}" stroke="#94a3b8"/><line x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${h-m.b}" stroke="#94a3b8"/>`;
  provinces.forEach((province,pi)=>{const data=ds().series[province]?.[valueType]||{};years.forEach(year=>{const pts=(data[year]||[]).filter(p=>p.value!=null&&isFinite(p.value));if(!pts.length)return;const multi=provinces.length>1;const stroke=multi?provinceColors[pi%provinceColors.length]:(yearColors[year]||'#888');const width=year==='2026'?(mini?2.4:3.4):(mini?1.1:1.7);const dash=year==='2021'?' stroke-dasharray="5 4"':(year!=='2026'&&multi?' stroke-dasharray="2 4"':'');const opacity=multi&&year!=='2026'?0.45:1;const d=pts.map((p,i)=>`${i?'L':'M'} ${sx(p.month).toFixed(1)} ${sy(p.value).toFixed(1)}`).join(' ');html+=`<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${width}" opacity="${opacity}"${dash}/>`;pts.forEach((p,i)=>{if(mini&&i%2)return;const x=sx(p.month),y=sy(p.value);html+=`<circle class="pt" cx="${x}" cy="${y}" r="${mini?2.2:3.2}" fill="${stroke}" opacity="${opacity}" data-tip="${province}｜${year}年${p.month}月｜${label()} ${fmtNum(p.value)} 万吨"/>`})})});svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=html;svg.querySelectorAll('.pt').forEach(el=>{el.addEventListener('mousemove',showTip);el.addEventListener('mouseleave',hideTip)})}
function renderLegend(){const ps=selected();$('legend').innerHTML=(ps.length>1?ps.map((p,i)=>`<span class="legend-item"><i class="swatch" style="background:${provinceColors[i%provinceColors.length]}"></i>${p}</span>`).join('')+`<span>｜实线/粗线=2026，虚线含2021等历史年</span>`:[...state.years].sort().map(y=>`<span class="legend-item"><i class="swatch" style="background:${yearColors[y]||'#888'}"></i>${y}${y==='2021'?'（已显示）':''}</span>`).join(''))}
function renderSummaryTable(){const rows=ds().summary;$('summaryTable').innerHTML=`<thead><tr><th>地区</th><th>当月值</th><th>环比</th><th>同比</th><th>累计值</th><th>累计同比</th><th>累计同比量</th></tr></thead><tbody>${rows.map(r=>`<tr data-province="${r.province}" class="${state.provinces.includes(r.province)?'active':''}"><td>${r.province}</td><td>${fmtNum(r.monthly)}</td><td class="${cls(r.momPct)}">${fmtPct(r.momPct)}</td><td class="${cls(r.yoyPct)}">${fmtPct(r.yoyPct)}</td><td>${fmtNum(r.cumulative)}</td><td class="${cls(r.cumulativeYoyPct)}">${fmtPct(r.cumulativeYoyPct)}</td><td class="${cls(r.cumulativeYoyDelta)}">${fmtNum(r.cumulativeYoyDelta)}</td></tr>`).join('')}</tbody>`;$('summaryTable').querySelectorAll('tbody tr').forEach(tr=>tr.addEventListener('click',()=>{const p=tr.dataset.province;const s=new Set(state.provinces);s.has(p)&&s.size>1?s.delete(p):s.add(p);setProvinces([...s])}))}
function renderMiniGrid(){const d=ds(),q=$('provinceSearch').value.trim(),rowMap=Object.fromEntries(d.summary.map(r=>[r.province,r]));let provinces=d.provinces.filter(p=>!q||p.includes(q));const mode=$('sortMode').value;if(mode!=='order'){provinces=provinces.slice().sort((a,b)=>{const ra=rowMap[a]||{},rb=rowMap[b]||{};const va=mode.includes('yoy')?(ra.cumulativeYoyPct??-999):(state.valueType==='monthly'?(ra.monthly??-999):(ra.cumulative??-999));const vb=mode.includes('yoy')?(rb.cumulativeYoyPct??-999):(state.valueType==='monthly'?(rb.monthly??-999):(rb.cumulative??-999));return mode.endsWith('asc')?va-vb:vb-va})}const limit=Number($('panelLimit').value);provinces=provinces.slice(0,limit);$('miniHint').textContent=`${provinces.length} 个面板；点击可加入/移除同图`; $('miniGrid').innerHTML=provinces.map(p=>{const r=rowMap[p]||{};return`<div class="mini" data-province="${p}"><div class="mini-title"><span>${state.provinces.includes(p)?'✓ ':''}${p}</span><span>${fmtNum(state.valueType==='monthly'?r.monthly:r.cumulative)}</span></div><svg viewBox="0 0 260 130"></svg></div>`}).join('');$('miniGrid').querySelectorAll('.mini').forEach(card=>{drawChart(card.querySelector('svg'),[card.dataset.province],state.valueType,260,130,true);card.addEventListener('click',()=>{const p=card.dataset.province;const s=new Set(state.provinces);s.has(p)&&s.size>1?s.delete(p):s.add(p);setProvinces([...s]);window.scrollTo({top:0,behavior:'smooth'})})})}

function exportCsv(){const rows=ds().summary.filter(r=>state.provinces.includes(r.province));const header=['来源','地区','最新日期','当月值','环比','同比','累计值','累计同比','累计同比量','上年同月累计'];const csv=[header.join(',')].concat(rows.map(r=>[ds().title,r.province,r.latestDate,r.monthly??'',r.momPct??'',r.yoyPct??'',r.cumulative??'',r.cumulativeYoyPct??'',r.cumulativeYoyDelta??'',r.lastYearCumulative??''].map(x=>`"${String(x).replaceAll('"','""')}"`).join(','))).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${ds().title}_多省同图_${ds().latestMonth}.csv`;a.click();URL.revokeObjectURL(a.href)}
